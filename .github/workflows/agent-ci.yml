name: Optional Agent CI

on:
  push:
    branches: [ main, "feature/**", "fix/**", "chore/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  agent-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile agent and canonical runtime
        run: python -m py_compile agent/P01_Agent.py agent/P01_Scheduler.py agent/P01_Linux_Service.py agent/P01_Windows_Service.py runtime/P01_Discovery_Node.py runtime/P01_Workspace_Lock.py
      - name: Validate default policy
        run: python agent/P01_Agent.py validate-policy --policy agent/agent-policy.example.json
      - name: Agent policy, journal and OS lock contracts
        run: python -m unittest discover -s tests -p "test_optional_agent.py" -v
      - name: Bounded scheduler and review recovery contracts
        run: python -m unittest discover -s tests -p "test_scheduler.py" -v
      - name: Windows service worker and configuration contracts
        run: python -m unittest discover -s tests -p "test_windows_service.py" -v
      - name: Linux service worker and unit ownership contracts
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p "test_linux_service.py" -v
      - name: Real Linux systemd lifecycle and crash review
        if: runner.os == 'Linux'
        run: sudo "$(which python)" tests/linux_service_systemd_smoke.py
      - name: Offline process interruption and journal content audit
        run: python docs/validation/OPTIONAL_AGENT_INTERRUPTION_R1.py --self-test
      - name: Offline isolated artifact and nested target tamper
        run: python docs/validation/OPTIONAL_AGENT_ARTIFACT_TAMPER_R1.py --self-test
      - name: Parse LAB helper with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Tokens = $null
          $ParseErrors = $null
          $File = Join-Path $PWD 'docs/validation/OPTIONAL_AGENT_TAMPER_R1.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($File, [ref]$Tokens, [ref]$ParseErrors)
          if ($ParseErrors.Count -gt 0) { throw ($ParseErrors.Message -join "`n") }
      - name: Exercise isolated config tamper helper offline
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Root = Join-Path $env:RUNNER_TEMP ('canca-agent-lab-' + [guid]::NewGuid().ToString('N'))
          python runtime/P01_Discovery_Node.py init --workspace-root $Root --assessment-id P01CI --run-id BASE --node-id P01-CI
          if ($LASTEXITCODE -ne 0) { throw 'CI workspace initialization failed.' }
          $Baseline = Join-Path (Join-Path $Root 'P01CI') 'BASE'
          & .\docs\validation\OPTIONAL_AGENT_TAMPER_R1.ps1 -CompletedWorkspace $Baseline
          if (-not $?) { throw 'LAB helper smoke test failed.' }
          $global:LASTEXITCODE = 0
      - name: Install Windows Service dependency
        if: runner.os == 'Windows'
        run: python -m pip install -r agent/requirements-windows-service.txt
      - name: Real Windows SCM lifecycle and crash review
        if: runner.os == 'Windows'
        run: python tests/windows_service_scm_smoke.py
      - name: Real Linux scheduled interval and interrupted wait
        if: runner.os == 'Linux'
        run: sudo "$(which python)" tests/scheduled_agent_soak.py
      - name: Real Windows scheduled interval and interrupted wait
        if: runner.os == 'Windows'
        run: python tests/scheduled_agent_soak.py

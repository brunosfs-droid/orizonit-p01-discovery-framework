name: Python CI

on:
  push:
    branches: [ main, "feature/**", "fix/**", "chore/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile collectors/linux/P01_Linux_Discovery_Collector.py
          python -m py_compile analyzer/P01_Discovery_Analyzer.py
          python -m py_compile network_discovery/P01_Network_Discovery_Scanner.py
          python -m py_compile credential_manager/P01_Credential_Manager.py
          python -m py_compile credentialed_enrichment/P01_SSH_Enricher.py
          python -m py_compile credentialed_enrichment/P01_WinRM_Enricher.py
          python -m py_compile orchestrator/P01_Credentialed_Discovery_Planner.py
          python -m py_compile orchestrator/P01_Credentialed_Discovery_Executor.py
          python -m py_compile asset_resolver/P01_Asset_Resolver.py
          python -m py_compile evidence_bundle/P01_Evidence_Bundle.py
          python -m py_compile ingestion/P01_Offline_Import.py
          python -m py_compile asset_resolver/P01_Asset_Resolver.py
          python -m py_compile evidence_bundle/P01_Evidence_Bundle.py

          python -m py_compile persistence/P01_PostgreSQL.py persistence/P01_Ingestion_Index.py persistence/P01_Assessment_Lifecycle.py persistence/P01_Asset_Registry.py persistence/P01_Findings.py ingestion/P01_Ingestion_API.py

      - name: Validate JSON artifacts
        run: |
          python -m json.tool persistence/P01_Finding_Rules.json > /dev/null
          python -m json.tool analyzer/P01_Rules.json > /dev/null
          python -m json.tool schemas/p01-discovery-schema-v0.2.json > /dev/null
          python -m json.tool schemas/p01-discovery-schema-v0.3.json > /dev/null
          python -m json.tool credential_manager/credentials.example.json > /dev/null
          python -m json.tool schemas/p01-credential-profiles-schema-v0.4b.json > /dev/null
          python -m json.tool schemas/p01-ssh-enrichment-schema-v0.4b.json > /dev/null
          python -m json.tool schemas/p01-winrm-enrichment-schema-v0.4b.json > /dev/null
          python -m json.tool schemas/p01-credentialed-job-schema-v0.4b.json > /dev/null
          python -m json.tool schemas/p01-asset-resolver-schema-v0.4c.json > /dev/null
          python -m json.tool schemas/p01-evidence-bundle-manifest-schema-v0.5a.json > /dev/null
          python -m json.tool schemas/p01-offline-import-receipt-schema-v0.5b.json > /dev/null
          python -m json.tool schemas/p01-asset-resolver-schema-v0.4c.json > /dev/null
          python -m json.tool schemas/p01-assessment-manifest-schema-v0.4b.6.json > /dev/null
          python -m json.tool schemas/p01-evidence-bundle-manifest-schema-v0.5a.json > /dev/null

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

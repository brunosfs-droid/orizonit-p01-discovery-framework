name: Python CI

on:
  push:
    branches: [ main, "feature/**", "fix/**", "chore/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile collectors/linux/P01_Linux_Discovery_Collector.py
          python -m py_compile analyzer/P01_Discovery_Analyzer.py
          python -m py_compile network_discovery/P01_Network_Discovery_Scanner.py\n          python -m py_compile credential_manager/P01_Credential_Manager.py

      - name: Validate JSON artifacts
        run: |
          python -m json.tool analyzer/P01_Rules.json > /dev/null
          python -m json.tool schemas/p01-discovery-schema-v0.2.json > /dev/null
          python -m json.tool schemas/p01-discovery-schema-v0.3.json > /dev/null\n          python -m json.tool credential_manager/credentials.example.json > /dev/null\n          python -m json.tool schemas/p01-credential-profiles-schema-v0.4b.json > /dev/null

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

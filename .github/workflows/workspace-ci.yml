name: Workspace Foundation CI

on:
  push:
    branches: [ main, "feature/**", "fix/**", "chore/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  workspace-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: canca_workspace_ci
          POSTGRES_USER: canca_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canca_ci -d canca_workspace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: canca_workspace_ci
      PGUSER: canca_ci
      PGPASSWORD: synthetic-ci-only
      CANCA_TEST_WORKSPACE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install -r persistence/requirements-postgres.txt
      - name: Compile workspace foundation
        run: python -m py_compile persistence/P01_Workspace.py persistence/P01_PostgreSQL.py persistence/P01_Workspace_Model.py server/P01_Workspace_Coordinator.py server/P01_Workspace_Service.py tests/test_postgres_workspace.py tests/test_workspace_coordinator.py tests/test_workspace_model.py tests/test_workspace_service.py
      - name: Test real workspace isolation and opt-in migration
        run: python -m unittest discover -s tests -p "test_postgres_workspace.py" -v
      - name: Test single-workspace lifecycle and real SQL session leases
        run: python -m unittest discover -s tests -p "test_workspace_coordinator.py" -v
      - name: Test workspace history graph and revision-fenced reconciliation
        run: python -m unittest discover -s tests -p "test_workspace_model.py" -v
      - name: Test registered workspace service operations and bounded sources
        run: python -m unittest discover -s tests -p "test_workspace_service.py" -v
